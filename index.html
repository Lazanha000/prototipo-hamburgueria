<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua Marca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sua Marca: cardápio e pedidos pelo WhatsApp.">
<meta name="theme-color" content="#FFFFFF">
<script>try{var t=localStorage.getItem("tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";if(t==="escuro"){document.documentElement.dataset.tema="escuro";document.querySelector('meta[name=theme-color]').content="#17130F"}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="topo" id="topo">
  <a class="marca" href="#inicio" aria-label="Sua Marca, página inicial">
    <svg class="marca-selo" viewBox="-20 -20 40 40" width="34" height="34" aria-hidden="true">
      <circle r="19" fill="#F15A24"/><circle r="16.3" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M-9.5,-0.8 C-9.5,-8.7 9.5,-8.7 9.5,-0.8 Z" fill="#FFFFFF"/>
      <rect x="-10.6" y="1" width="21.3" height="2.9" rx="1.4" fill="#111111"/>
      <rect x="-9.5" y="5.1" width="19" height="2.9" rx="1.4" fill="#FFFFFF"/>
    </svg>
    <span class="marca-nome">SUA<b>MARCA</b></span>
  </a>
  <nav class="topo-nav" aria-label="Principal">
    <a href="#cardapio">Cardápio</a>
    <a href="#pedido" aria-label="Acompanhar pedido"><svg class="so-curto" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="so-largo">Acompanhar pedido</span></a>
  </nav>
  <button class="btn-tema" id="btn-tema" type="button" aria-label="Alternar tema escuro" aria-pressed="false">
    <svg class="sol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="lua" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <a class="topo-carrinho" id="cart-link" href="#carrinho" aria-label="Carrinho vazio">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="topo-carrinho-txt">Carrinho</span>
    <span class="contador" id="cart-count" hidden>0</span>
  </a>
</header>

<main id="conteudo" tabindex="-1"></main>

<footer class="rodape">
  <div class="wrap rodape-grade">
    <div class="rodape-marca">
      <p class="rodape-nome">SUA <b>MARCA</b></p>
      <p>Hambúrguer feito na hora, entregue na caixa da casa.</p>
    </div>
    <div>
      <p class="rodape-tit">Horário</p>
      <div id="horario-rodape"></div>
    </div>
    <nav aria-label="Rodapé">
      <p class="rodape-tit">Pedidos</p>
      <a href="#cardapio">Cardápio</a><a href="#carrinho">Carrinho</a><a href="#pedido">Acompanhar pedido</a><a href="#privacidade">Política de privacidade</a>
    </nav>
  </div>
  <div class="wrap rodape-fim">
    <p>Sua Marca · Sua Cidade, UF · © <span id="ano"></span></p>
  </div>
</footer>

<div id="area-impressao"></div>
<div class="wa" id="wa"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
