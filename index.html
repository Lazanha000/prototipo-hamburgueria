<!-- Segurança (CSP): só roda script do próprio site. O sha256 é do script do tema abaixo:
     se mudar esse script (ex.: ao trocar o id do cliente), rode node conferir-modelo.mjs,
     que mostra o hash novo. 'unsafe-inline' em style-src é por causa dos atributos style
     da animação de abertura (js/scene.js, js/box.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-EKfHrmSZvvg4opEbmhQ/wlpotV5hGBgFnF7DqnxWmRg='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<meta name="theme-color" content="#FFFFFF">
<!-- "modelo:tema:v1" = CHAVES.tema de js/utils.js: troque "modelo" junto com CONFIG.marca.id.
     O mesmo script pede as fotos do lanche da abertura (js/art.js, CINE_LAYERS) só quando a pessoa
     entra pelo início: quem chega direto em #cardapio, #carrinho... não baixa essas fotos.
     Trocou as camadas? Atualize a lista aqui e rode node conferir-modelo.mjs (hash da CSP). -->
<script>try{var t=localStorage.getItem("modelo:tema:v1");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";if(t==="escuro"){document.documentElement.dataset.tema="escuro";document.querySelector('meta[name=theme-color]').content="#17130F"}}catch(e){}try{var h=location.hash.replace(/^#\/?/,"").split("?")[0];if(h===""||h==="inicio")"paoTopo picles cebola bacon queijo carne salada paoBase".split(" ").forEach(function(n){var l=document.createElement("link");l.rel="preload";l.as="image";l.type="image/webp";l.fetchPriority="high";l.href="assets/cena/camadas/"+n+".webp";document.head.appendChild(l)})}catch(e){}</script>
