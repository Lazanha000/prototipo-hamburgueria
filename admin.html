<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Painel do restaurante. Segurança (CSP): só script do próprio site, sem nenhum script inline.
     wss://*.supabase.co é a conexão de pedidos em tempo real. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Painel do restaurante</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="modulepreload" href="painel/painel.js">
<link rel="modulepreload" href="painel/supabase.js">
<link rel="modulepreload" href="painel/logica.js">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="painel/painel.css">
</head>
<body class="painel">
<header class="pn-topo">
  <p class="pn-marca"><b data-marca>Restaurante</b> <span>Painel</span></p>
  <div class="pn-topo-acoes" id="pn-acoes" hidden>
    <span class="pn-conexao" id="pn-conexao" role="status" data-estado="conectando">Conectando…</span>
    <button class="pn-btn-icone" type="button" id="pn-som" aria-pressed="false" title="Som de pedido novo">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="pn-som-txt">Som desligado</span>
    </button>
    <button class="pn-btn-icone" type="button" id="pn-sair">Sair</button>
  </div>
</header>

<main id="pn-conteudo" class="pn-conteudo" tabindex="-1">
  <noscript><p class="aviso aviso--alerta">O painel precisa de JavaScript.</p></noscript>
</main>

<div id="area-impressao"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="painel/painel.js"></script>
</body>
</html>
